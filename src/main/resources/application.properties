spring.application.name=Tooth_office

spring.datasource.url=jdbc:mysql://localhost:3306/ToothOffice_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Force l'exécution de data.sql APRÈS la création des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

# Indique qu'il faut toujours initialiser la base avec le fichier SQL
spring.sql.init.mode=always

# Configuration JWT
app.jwt.secret=ToothOfficeJwtSecretKeyForBeginnersNeedsAtLeastThirtyTwoChars
app.jwt.expiration-ms=3600000

# Duree du refresh token : 30 jours
app.jwt.refresh-expiration-ms=2592000000

server.address=0.0.0.0
server.port=8080